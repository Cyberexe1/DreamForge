version = 0.1

[default.deploy.parameters]
stack_name = "dreamforge"
region = "us-east-1"
capabilities = "CAPABILITY_NAMED_IAM"
confirm_changeset = false
resolve_s3 = true
parameter_overrides = [
  "ArtifactsBucket=dreamforge-artifacts-961308088417",
  "HistoryTable=dreamforge-history",
  "DistributionId=E1JWXDVORYY3V8",
]

[default.build.parameters]
# The agent has no third-party dependencies, so no container build is needed.
cached = true
parallel = true
